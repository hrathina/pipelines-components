schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-extract-speculator:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - componentInputParameter: persistent_pvc
            mountPath: /mnt/persistent
            pvcNameParameter:
              componentInputParameter: persistent_pvc
          secretAsEnv:
          - keyToEnv:
            - envVar: KUBERNETES_SERVER_URL
              secretKey: KUBERNETES_SERVER_URL
            - envVar: KUBERNETES_AUTH_TOKEN
              secretKey: KUBERNETES_AUTH_TOKEN
            optional: false
            secretName: kubernetes-credentials
            secretNameParameter:
              runtimeValue:
                constant: kubernetes-credentials
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-train-speculator-mode:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - componentInputParameter: persistent_pvc
            mountPath: /mnt/persistent
            pvcNameParameter:
              componentInputParameter: persistent_pvc
          secretAsEnv:
          - keyToEnv:
            - envVar: KUBERNETES_SERVER_URL
              secretKey: KUBERNETES_SERVER_URL
            - envVar: KUBERNETES_AUTH_TOKEN
              secretKey: KUBERNETES_AUTH_TOKEN
            optional: false
            secretName: kubernetes-credentials
            secretNameParameter:
              runtimeValue:
                constant: kubernetes-credentials
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
    pipelineConfig:
      workspace:
        kubernetes:
          pvcSpecPatch:
            accessModes:
            - ReadWriteMany
            storageClassName: nfs-csi
        size: 200Gi
