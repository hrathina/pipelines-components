# PIPELINE DEFINITION
# Name: speculator-offline-pipeline
# Description: Extract verifier hidden states for speculative decoding training with external vLLM, train and evaluate the draft, optionally register it, then serve it.
# Inputs:
#    p01_persistent_pvc: str
#    p02_verifier_model_pvc: str
#    p03_vllm_endpoint: str
#    p04_dataset_name: str
#    p05_evaluation_dataset_uri: str
#    p06_serving_namespace: str
#    p07_data_extraction_max_samples: int [Default: 0.0]
#    p08_data_extraction_regenerate_responses: bool [Default: False]
#    p09_data_extraction_concurrency: int [Default: 1.0]
#    p10_output_dir: str [Default: 'speculator-output']
#    p11_hidden_states_path: str [Default: 'speculator-output/hidden_states']
#    p12_training_data_path: str [Default: 'speculator-output']
#    p13_total_seq_len: int [Default: 2048.0]
#    p14_speculator_type: str [Default: 'eagle3']
#    p15_target_layer_ids: str [Default: '']
#    p16_training_epochs: int [Default: 3.0]
#    p17_training_lr: float [Default: 0.0001]
#    p18_training_draft_vocab_size: int [Default: 0.0]
#    p19_training_num_layers: int [Default: 1.0]
#    p20_training_test_time_steps: int [Default: 1.0]
#    p21_training_norm_before_residual: bool [Default: True]
#    p22_training_norm_before_fc: bool [Default: False]
#    p23_training_embed_requires_grad: bool [Default: False]
#    p24_training_hidden_states_dtype: str [Default: 'bfloat16']
#    p25_training_scheduler_type: str [Default: 'linear']
#    p26_training_scheduler_warmup_steps: int [Default: 0.0]
#    p27_training_scheduler_total_steps: int [Default: 0.0]
#    p30_training_save_best: bool [Default: False]
#    p32_training_resume_from_checkpoint: bool [Default: False]
#    p33_training_resource_cpu: str [Default: '4']
#    p34_training_resource_gpu: int [Default: 1.0]
#    p35_training_resource_memory: str [Default: '64Gi']
#    p36_job_envs: str [Default: 'NCCL_DEBUG=INFO,PYTHONUNBUFFERED=1']
#    p37_job_runtime: str [Default: 'speculator-model-opt-cuda']
#    p38_packages_to_install: str [Default: '']
#    p40_evaluation_max_samples: int [Default: 80.0]
#    p41_evaluation_max_tokens: int [Default: 256.0]
#    p42_evaluation_temperature: float [Default: 0.0]
#    p43_evaluation_num_speculative_tokens: int [Default: 5.0]
#    p44_evaluation_gpu_memory_utilization: float [Default: 0.9]
#    p45_evaluation_startup_timeout_seconds: int [Default: 900.0]
#    p47_model_registry_address: str [Default: '']
#    p48_model_registry_port: int [Default: 8080.0]
#    p49_model_registry_name: str [Default: 'speculator-offline-draft']
#    p50_model_registry_version: str [Default: '1.0.0']
#    p51_serving_endpoint_name: str [Default: 'speculator-offline']
#    p52_serving_runtime_image: str [Default: 'registry.redhat.io/rhaii-fast/vllm-cuda-rhel9@sha256:97c7d6f66f3f0897b3ff10ddd135de930d45bdd116cf41a43e3ad7270029116a']
components:
  comp-evaluate-speculator:
    executorLabel: exec-evaluate-speculator
    inputDefinitions:
      parameters:
        draft_model_path:
          description: Draft directory under the model mount, optionally using pvc://<claim>/<path>
            syntax.
          parameterType: STRING
        evaluation_dataset_mount_path:
          defaultValue: /mnt/persistent
          description: Root directory for local datasets; resolved paths must stay
            inside it.
          isOptional: true
          parameterType: STRING
        evaluation_dataset_pvc:
          defaultValue: ''
          description: 'Mounted PVC claim name. Every ``pvc://`` URI must use this
            exact

            claim name; relative paths need no PVC prefix.'
          isOptional: true
          parameterType: STRING
        evaluation_dataset_uri:
          description: 'Hugging Face dataset ID, relative path under the dataset mount,
            or

            ``pvc://<claim>/<path>``.'
          parameterType: STRING
        evaluation_gpu_memory_utilization:
          defaultValue: 0.9
          description: vLLM GPU memory utilization fraction.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        evaluation_max_samples:
          defaultValue: 80.0
          description: Maximum GuideLLM requests at each sweep point.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_max_tokens:
          defaultValue: 256.0
          description: Maximum generation tokens for each request.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_model_mount_path:
          defaultValue: /mnt/persistent
          description: Root directory for verifier and draft models; resolved paths
            must stay inside it.
          isOptional: true
          parameterType: STRING
        evaluation_num_speculative_tokens:
          defaultValue: 5.0
          description: Number of draft tokens proposed by vLLM.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_port:
          defaultValue: 8000.0
          description: Local port for the temporary vLLM endpoint.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_sample_seed:
          defaultValue: 42.0
          description: Seed used when sampling a local JSONL dataset.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_speculator_type:
          description: Speculator method configured on the vLLM server.
          parameterType: STRING
        evaluation_startup_timeout_seconds:
          defaultValue: 900.0
          description: Maximum wait for the vLLM health endpoint.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_temperature:
          defaultValue: 0.0
          description: Sampling temperature passed through to GuideLLM.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        evaluation_timeout_seconds:
          defaultValue: 7200.0
          description: Maximum time allowed for the upstream evaluation sweep.
          isOptional: true
          parameterType: NUMBER_INTEGER
        verifier_model:
          description: Verifier directory under the model mount, optionally using
            pvc://<claim>/<path> syntax.
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-extract-hidden-states:
    executorLabel: exec-extract-hidden-states
    inputDefinitions:
      parameters:
        data_extraction_concurrency:
          defaultValue: 4.0
          description: Number of concurrent vLLM requests for hidden-state extraction.
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_extraction_max_samples:
          description: Number of samples to process; zero or None means all.
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_extraction_regenerate_responses:
          defaultValue: false
          description: 'Regenerate responses for ``magpie``,

            ``ultrachat``, or ``gsm8k`` with the verifier.'
          isOptional: true
          parameterType: BOOLEAN
        dataset_download_enabled:
          defaultValue: false
          description: Use the downloaded dataset URI instead of ``dataset_name``.
          isOptional: true
          parameterType: BOOLEAN
        dataset_name:
          description: '``magpie``, ``ultrachat``, ``gsm8k``, local JSON/JSONL path,
            or Trainer PVC URI.'
          parameterType: STRING
        download_model:
          defaultValue: false
          description: Download the verifier model to the shared PVC before extraction.
          isOptional: true
          parameterType: BOOLEAN
        downloaded_dataset_uri:
          description: URI emitted by the dataset download step when enabled.
          isOptional: true
          parameterType: STRING
        enable_progression_tracking:
          defaultValue: true
          description: Enable progress reporting.
          isOptional: true
          parameterType: BOOLEAN
        hidden_states_path:
          description: Hidden-state directory as a relative PVC path or explicit PVC
            URI.
          isOptional: true
          parameterType: STRING
        kubernetes_config:
          description: KFP task Kubernetes configuration passed through to Trainer.
          isOptional: true
          parameterType: TASK_CONFIG
        metrics_poll_interval_seconds:
          defaultValue: 30.0
          description: Seconds between metrics polls; valid range is ``5``-``300``.
          isOptional: true
          parameterType: NUMBER_INTEGER
        metrics_port:
          defaultValue: 28080.0
          description: HTTP port for extraction metrics; valid range is ``1024``-``65535``.
          isOptional: true
          parameterType: NUMBER_INTEGER
        output_dir:
          description: Output directory as a relative PVC path or an explicit ``pvc://<claim>/<path>``
            URI.
          parameterType: STRING
        packages_to_install:
          description: Comma-separated packages for the Trainer job.
          isOptional: true
          parameterType: STRING
        persistent_mount_path:
          defaultValue: /mnt/persistent
          description: Local mount path corresponding to ``persistent_pvc``.
          isOptional: true
          parameterType: STRING
        persistent_pvc:
          defaultValue: ''
          description: Name of the shared PVC mounted at ``persistent_mount_path``.
          isOptional: true
          parameterType: STRING
        pip_index_urls:
          description: Comma-separated package indexes for the Trainer job.
          isOptional: true
          parameterType: STRING
        pvc_path:
          description: KFP workspace mount path used to resolve the workspace PVC.
          parameterType: STRING
        speculator_type:
          defaultValue: eagle3
          description: Draft architecture; ``eagle3`` is currently the only supported
            type.
          isOptional: true
          parameterType: STRING
        target_layer_ids:
          description: 'Exactly four comma-separated verifier layer IDs; required

            for PVC-backed models and external vLLM.'
          isOptional: true
          parameterType: STRING
        total_seq_len:
          defaultValue: 2048.0
          description: Maximum sequence length for dataset preprocessing and vLLM
            extraction; must be positive.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_envs:
          defaultValue: ''
          description: Comma-separated environment overrides for the Trainer job.
          isOptional: true
          parameterType: STRING
        training_runtime:
          defaultValue: speculator-model-opt-cuda
          description: ClusterTrainingRuntime used for extraction.
          isOptional: true
          parameterType: STRING
        verifier_model:
          description: Hugging Face verifier ID to download, or the verifier path
            used by the runtime.
          parameterType: STRING
        verifier_model_pvc:
          description: Cached verifier path as a relative PVC path or explicit PVC
            URI.
          isOptional: true
          parameterType: STRING
        vllm_endpoint:
          description: Required remote vLLM URL; unset for managed mode.
          isOptional: true
          parameterType: STRING
        vllm_gpu_memory_utilization:
          defaultValue: 0.9
          description: Fraction of GPU memory available to vLLM, in the range ``(0,
            1]``.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        vllm_readiness_timeout_minutes:
          defaultValue: 60.0
          description: 'Maximum wait for the managed or remote vLLM

            endpoint to become ready, in minutes.'
          isOptional: true
          parameterType: NUMBER_INTEGER
        vllm_resource_gpu:
          defaultValue: 1.0
          description: GPUs requested by managed vLLM; the SDK supports exactly one.
          isOptional: true
          parameterType: NUMBER_INTEGER
        vllm_resource_memory:
          defaultValue: 96Gi
          description: Memory requested by managed vLLM.
          isOptional: true
          parameterType: STRING
        vllm_source:
          defaultValue: managed
          description: '``managed`` for the in-job sidecar or ``remote`` for an external
            vLLM service.'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_hidden_states:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
    taskConfigPassthroughs:
    - field: RESOURCES
    - field: KUBERNETES_TOLERATIONS
    - field: KUBERNETES_NODE_SELECTOR
    - field: KUBERNETES_AFFINITY
    - applyToTask: true
      field: ENV
    - applyToTask: true
      field: KUBERNETES_VOLUMES
  comp-kubeflow-model-registry:
    executorLabel: exec-kubeflow-model-registry
    inputDefinitions:
      artifacts:
        eval_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Evaluation metrics from lm-eval.
          isOptional: true
        eval_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Full evaluation results JSON artifact.
          isOptional: true
        input_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Training metrics.
          isOptional: true
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Model artifact from training step.
          isOptional: true
      parameters:
        author:
          defaultValue: pipeline
          description: Author name for the model registration.
          isOptional: true
          parameterType: STRING
        model_description:
          defaultValue: ''
          description: Optional description for the model.
          isOptional: true
          parameterType: STRING
        model_format_name:
          defaultValue: pytorch
          description: Model format name (e.g. "pytorch", "onnx").
          isOptional: true
          parameterType: STRING
        model_format_version:
          defaultValue: '1.0'
          description: Model format version.
          isOptional: true
          parameterType: STRING
        model_name:
          defaultValue: fine-tuned-model
          description: Name for the registered model.
          isOptional: true
          parameterType: STRING
        model_pvc_name:
          defaultValue: ''
          description: Name of the persistent PVC containing the model.
          isOptional: true
          parameterType: STRING
        model_version:
          defaultValue: 1.0.0
          description: Version string for the model (e.g. "1.0.0").
          isOptional: true
          parameterType: STRING
        pvc_mount_path:
          description: PVC mount path for workspace storage.
          parameterType: STRING
        registry_address:
          defaultValue: ''
          description: Model Registry server address (hostname or IP).
          isOptional: true
          parameterType: STRING
        registry_port:
          defaultValue: 8080.0
          description: 'Model Registry server port (default: 8080).'
          isOptional: true
          parameterType: NUMBER_INTEGER
        shared_log_file:
          defaultValue: pipeline_log.txt
          description: Filename for shared pipeline log.
          isOptional: true
          parameterType: STRING
        source_namespace:
          defaultValue: ''
          description: Namespace where pipeline runs (auto-detected if empty).
          isOptional: true
          parameterType: STRING
        source_pipeline_name:
          defaultValue: ''
          description: Name of the source KFP pipeline.
          isOptional: true
          parameterType: STRING
        source_pipeline_run_id:
          defaultValue: ''
          description: Unique ID of the pipeline run.
          isOptional: true
          parameterType: STRING
        source_pipeline_run_name:
          defaultValue: ''
          description: Display name of the pipeline run.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-speculative-decoding-serving:
    executorLabel: exec-speculative-decoding-serving
    inputDefinitions:
      parameters:
        cpu_limits:
          defaultValue: '2'
          description: Predictor CPU limit.
          isOptional: true
          parameterType: STRING
        cpu_requests:
          defaultValue: '2'
          description: Predictor CPU request.
          isOptional: true
          parameterType: STRING
        draft_model_dir:
          description: Draft directory relative to the PVC root or a matching ``pvc://``
            URI.
          parameterType: STRING
        draft_tensor_parallel_size:
          defaultValue: 1.0
          description: vLLM tensor parallel size for the draft model.
          isOptional: true
          parameterType: NUMBER_INTEGER
        enable_auth:
          defaultValue: false
          description: Enable RHOAI authentication for the exposed endpoint.
          isOptional: true
          parameterType: BOOLEAN
        enable_external_route:
          defaultValue: false
          description: 'Request external visibility and wait for the

            platform-managed OpenShift Route to be admitted with the requested

            authentication settings. No Route write permissions are needed. When

            ``False`` (the default), request cluster-local visibility and return

            the internal cluster URL.'
          isOptional: true
          parameterType: BOOLEAN
        endpoint_name:
          description: DNS-compatible InferenceService name.
          parameterType: STRING
        gpu_count:
          defaultValue: 1.0
          description: GPUs per predictor; also used as verifier vLLM tensor parallel
            size.
          isOptional: true
          parameterType: NUMBER_INTEGER
        gpu_memory_utilization:
          defaultValue: 0.9
          description: Fraction of GPU memory available to vLLM.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        hardware_profile_name:
          defaultValue: gpu-profile
          description: 'Existing RHOAI HardwareProfile name in

            ``redhat-ods-applications``, or empty to skip lookup and remove an old

            profile reference. A missing requested profile is an error.'
          isOptional: true
          parameterType: STRING
        max_model_len:
          defaultValue: 4096.0
          description: Maximum verifier context length.
          isOptional: true
          parameterType: NUMBER_INTEGER
        max_num_seqs:
          defaultValue: 16.0
          description: Maximum concurrent sequences in the vLLM scheduler.
          isOptional: true
          parameterType: NUMBER_INTEGER
        max_replicas:
          defaultValue: 1.0
          description: Maximum number of predictor replicas.
          isOptional: true
          parameterType: NUMBER_INTEGER
        memory_limits:
          defaultValue: 8Gi
          description: Predictor memory limit.
          isOptional: true
          parameterType: STRING
        memory_requests:
          defaultValue: 8Gi
          description: Predictor memory request.
          isOptional: true
          parameterType: STRING
        min_replicas:
          defaultValue: 1.0
          description: Minimum number of predictor replicas.
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_cache_pvc:
          description: PVC containing both model directories.
          parameterType: STRING
        namespace:
          description: Namespace in which to create the KServe resources.
          parameterType: STRING
        num_speculative_tokens:
          defaultValue: 3.0
          description: Number of draft tokens proposed per step.
          isOptional: true
          parameterType: NUMBER_INTEGER
        runtime_image:
          defaultValue: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9@sha256:97c7d6f66f3f0897b3ff10ddd135de930d45bdd116cf41a43e3ad7270029116a
          description: vLLM CUDA image supporting Eagle3 speculative decoding.
          isOptional: true
          parameterType: STRING
        trust_remote_code:
          defaultValue: false
          description: Pass ``--trust-remote-code`` for the draft checkpoint.
          isOptional: true
          parameterType: BOOLEAN
        verifier_model_dir:
          description: Verifier directory relative to the PVC root or a matching ``pvc://``
            URI.
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-train-speculator-mode:
    executorLabel: exec-train-speculator-mode
    inputDefinitions:
      parameters:
        data_extraction_concurrency:
          defaultValue: 4.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        enable_progression_tracking:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        hidden_states_path:
          parameterType: STRING
        kubernetes_config:
          isOptional: true
          parameterType: TASK_CONFIG
        metrics_poll_interval_seconds:
          defaultValue: 30.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        metrics_port:
          defaultValue: 28080.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        output_dir:
          parameterType: STRING
        packages_to_install:
          isOptional: true
          parameterType: STRING
        persistent_mount_path:
          defaultValue: /mnt/persistent
          isOptional: true
          parameterType: STRING
        persistent_pvc:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        pip_index_urls:
          isOptional: true
          parameterType: STRING
        pvc_path:
          parameterType: STRING
        speculator_type:
          defaultValue: eagle3
          isOptional: true
          parameterType: STRING
        target_layer_ids:
          isOptional: true
          parameterType: STRING
        total_seq_len:
          defaultValue: 2048.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_checkpoint_freq:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_data_path:
          isOptional: true
          parameterType: STRING
        training_draft_vocab_size:
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_embed_requires_grad:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_envs:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        training_epochs:
          defaultValue: 3.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_from_pretrained:
          isOptional: true
          parameterType: STRING
        training_hidden_states_dtype:
          defaultValue: bfloat16
          isOptional: true
          parameterType: STRING
        training_log_freq:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_lr:
          defaultValue: 0.0001
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_norm_before_fc:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_norm_before_residual:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        training_num_layers:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_resource_cpu:
          defaultValue: '4'
          isOptional: true
          parameterType: STRING
        training_resource_gpu:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_resource_memory:
          defaultValue: 64Gi
          isOptional: true
          parameterType: STRING
        training_resume_from_checkpoint:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_runtime:
          defaultValue: speculator-model-opt-cuda
          isOptional: true
          parameterType: STRING
        training_save_best:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_scheduler_num_cosine_cycles:
          defaultValue: 0.5
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_scheduler_total_steps:
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_scheduler_type:
          defaultValue: linear
          isOptional: true
          parameterType: STRING
        training_scheduler_warmup_steps:
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_ttt_steps:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        verifier_model:
          parameterType: STRING
        verifier_model_pvc:
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
    taskConfigPassthroughs:
    - field: RESOURCES
    - field: KUBERNETES_TOLERATIONS
    - field: KUBERNETES_NODE_SELECTOR
    - field: KUBERNETES_AFFINITY
    - applyToTask: true
      field: ENV
    - applyToTask: true
      field: KUBERNETES_VOLUMES
deploymentSpec:
  executors:
    exec-evaluate-speculator:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_speculator
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ 'requests>=2.32.0' 'guidellm~=0.7.1' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef _resolve_evaluation_dataset_path(uri: str, mount_path: str, persistent_pvc:\
          \ str = \"\") -> str:\n    \"\"\"Resolve a mounted-PVC path and reject traversal\
          \ or mismatched PVC URIs.\"\"\"\n    import os\n\n    path = uri\n    if\
          \ path.startswith(\"pvc://\"):\n        pvc_uri = path.removeprefix(\"pvc://\"\
          )\n        pvc_name, separator, path = pvc_uri.partition(\"/\")\n      \
          \  if not persistent_pvc:\n            raise ValueError(\"A mounted PVC\
          \ name is required to resolve pvc:// URIs\")\n        if pvc_name != persistent_pvc:\n\
