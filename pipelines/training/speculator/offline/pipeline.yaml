deploymentSpec:
  executors:
    exec-extract-speculator:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - extract_speculator
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ 'kubernetes' 'olot' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n\n\n\ndef extract_speculator(\n    verifier_model: str,\n    output_dir:\
          \ str,\n    pvc_path: str,\n    dataset_name: str,\n    hidden_states_path:\
          \ Optional[str] = None,\n    vllm_endpoint: Optional[str] = None,\n    total_seq_len:\
          \ int = 2048,\n    speculator_type: str = \"eagle3\",\n    target_layer_ids:\
          \ Optional[str] = None,\n    data_extraction_max_samples: Optional[int]\
          \ = None,\n    data_extraction_regenerate_responses: bool = False,\n   \
          \ data_extraction_concurrency: int = 4,\n    vllm_resource_gpu: int = 1,\n\
          \    vllm_resource_memory: str = \"96Gi\",\n    vllm_gpu_memory_utilization:\
          \ float = 0.9,\n    vllm_readiness_timeout_minutes: int = 60,\n    enable_progression_tracking:\
          \ bool = True,\n    metrics_port: int = 28080,\n    metrics_poll_interval_seconds:\
          \ int = 30,\n    packages_to_install: Optional[str] = None,\n    pip_index_urls:\
          \ Optional[str] = None,\n    training_envs: str = \"\",\n    training_runtime:\
          \ str = \"speculator-model-opt-cuda\",\n    persistent_pvc: str = \"\",\n\
          \    persistent_mount_path: str = \"/mnt/persistent\",\n    download_model:\
          \ bool = False,\n    output_hidden_states: dsl.Output[dsl.Artifact] = None,\n\
          \    kubernetes_config: dsl.TaskConfig = None,\n) -> str:\n    \"\"\"Extract\
          \ verifier hidden states using managed or external vLLM.\n\n    ``dataset_name``\
          \ selects the source dataset. When regeneration is enabled,\n    responses\
          \ are regenerated through the verifier before hidden-state extraction.\n\
          \    Managed mode uses the in-job vLLM sidecar; providing ``vllm_endpoint``\
          \ uses an\n    external vLLM service and requires matching shared model\
          \ and hidden-state paths.\n    \"\"\"\n    from speculator import run_speculator\n\
          \n    return run_speculator(\"data_only\", locals())\n\n"
        image: quay.io/opendatahub/odh-th-torch-cuda-py312:odh-3.6-ea.1@sha256:9ad2d72ebe892dffd3554eeb81e2a47c9fcf0d97f89ed261d48f4e8bbc367b4b
    exec-train-speculator-mode:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_speculator_mode
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ 'kubernetes' 'olot' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\n__KFP_EMBEDDED_ARCHIVE_B64 = ''\n\
          \nimport base64 as __kfp_b64\nimport io as __kfp_io\nimport os as __kfp_os\n\
          import sys as __kfp_sys\nimport tarfile as __kfp_tarfile\nimport tempfile\
          \ as __kfp_tempfile\n\n# Extract embedded archive at import time to ensure\
          \ sys.path and globals are set\n__kfp_tmpdir = __kfp_tempfile.TemporaryDirectory()\n\
          __KFP_EMBEDDED_ASSET_DIR = __kfp_tmpdir.name\ntry:\n    __kfp_bytes = __kfp_b64.b64decode(__KFP_EMBEDDED_ARCHIVE_B64.encode('ascii'))\n\
          \    with __kfp_tarfile.open(fileobj=__kfp_io.BytesIO(__kfp_bytes), mode='r:gz')\
          \ as __kfp_tar:\n        __kfp_tar.extractall(path=__KFP_EMBEDDED_ASSET_DIR)\n\
          except Exception as __kfp_e:\n    raise RuntimeError(f'Failed to extract\
          \ embedded archive: {__kfp_e}')\n\n# Always prepend the extracted directory\
          \ to sys.path for import resolution\nif __KFP_EMBEDDED_ASSET_DIR not in\
          \ __kfp_sys.path:\n    __kfp_sys.path.insert(0, __KFP_EMBEDDED_ASSET_DIR)\n\
          \n\n\n\ndef train_speculator_mode(\n    verifier_model: str,\n    output_dir:\
          \ str,\n    pvc_path: str,\n    hidden_states_path: str,\n    verifier_model_pvc:\
          \ Optional[str] = None,\n    training_data_path: Optional[str] = None,\n\
          \    total_seq_len: int = 2048,\n    speculator_type: str = \"eagle3\",\n\
          \    target_layer_ids: Optional[str] = None,\n    training_epochs: int =\
          \ 3,\n    training_lr: float = 1e-4,\n    training_draft_vocab_size: Optional[int]\
          \ = None,\n    training_num_layers: int = 1,\n    training_ttt_steps: int\
          \ = 1,\n    training_norm_before_residual: bool = True,\n    training_norm_before_fc:\
          \ bool = False,\n    training_embed_requires_grad: bool = False,\n    training_hidden_states_dtype:\
          \ str = \"bfloat16\",\n    training_scheduler_type: str = \"linear\",\n\
          \    training_scheduler_warmup_steps: Optional[int] = None,\n    training_scheduler_total_steps:\
          \ Optional[int] = None,\n    training_scheduler_num_cosine_cycles: float\
          \ = 0.5,\n    training_checkpoint_freq: float = 1.0,\n    training_save_best:\
          \ bool = False,\n    training_log_freq: int = 1,\n    training_resume_from_checkpoint:\
          \ bool = False,\n    training_from_pretrained: Optional[str] = None,\n \
          \   training_resource_cpu: str = \"4\",\n    training_resource_gpu: int\
          \ = 1,\n    training_resource_memory: str = \"64Gi\",\n    data_extraction_concurrency:\
          \ int = 4,\n    enable_progression_tracking: bool = True,\n    metrics_port:\
          \ int = 28080,\n    metrics_poll_interval_seconds: int = 30,\n    packages_to_install:\
          \ Optional[str] = None,\n    pip_index_urls: Optional[str] = None,\n   \
          \ training_envs: str = \"\",\n    training_runtime: str = \"speculator-model-opt-cuda\"\
          ,\n    persistent_pvc: str = \"\",\n    persistent_mount_path: str = \"\
          /mnt/persistent\",\n    output_model: dsl.Output[dsl.Model] = None,\n  \
          \  output_metrics: dsl.Output[dsl.Metrics] = None,\n    kubernetes_config:\
          \ dsl.TaskConfig = None,\n) -> str:\n    \"\"\"Train a draft model from\
          \ hidden states already stored on the PVC.\"\"\"\n    from speculator import\
          \ run_speculator\n\n    return run_speculator(\"train_only\", locals())\n\
          \n"
        image: quay.io/opendatahub/odh-th-torch-cuda-py312:odh-3.6-ea.1@sha256:9ad2d72ebe892dffd3554eeb81e2a47c9fcf0d97f89ed261d48f4e8bbc367b4b
