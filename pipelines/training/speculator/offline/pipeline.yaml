pipelineInfo:
  description: Extract verifier hidden states for speculative decoding training with
    external vLLM, train and evaluate the draft, optionally register it, then serve
    it.
  name: speculator-offline-pipeline
root:
  dag:
    tasks:
      evaluate-speculator:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-speculator
        dependentTasks:
        - train-speculator-mode
        inputs:
          parameters:
            draft_model_path:
              runtimeValue:
                constant: /mnt/persistent/final_model
            evaluation_dataset_pvc:
              componentInputParameter: p01_persistent_pvc
            evaluation_dataset_uri:
              componentInputParameter: p05_evaluation_dataset_uri
            evaluation_gpu_memory_utilization:
              componentInputParameter: p44_evaluation_gpu_memory_utilization
            evaluation_max_samples:
              componentInputParameter: p40_evaluation_max_samples
            evaluation_max_tokens:
              componentInputParameter: p41_evaluation_max_tokens
            evaluation_num_speculative_tokens:
              componentInputParameter: p43_evaluation_num_speculative_tokens
            evaluation_sample_seed:
              runtimeValue:
                constant: 42.0
            evaluation_speculator_type:
              componentInputParameter: p14_speculator_type
            evaluation_startup_timeout_seconds:
              componentInputParameter: p45_evaluation_startup_timeout_seconds
            evaluation_temperature:
              componentInputParameter: p42_evaluation_temperature
            verifier_model:
              componentInputParameter: p02_verifier_model_pvc
        taskInfo:
          name: evaluate-speculator
      extract-hidden-states:
        cachingOptions: {}
        componentRef:
          name: comp-extract-hidden-states
        inputs:
          parameters:
            data_extraction_concurrency:
              componentInputParameter: p09_data_extraction_concurrency
            data_extraction_max_samples:
              componentInputParameter: p07_data_extraction_max_samples
            data_extraction_regenerate_responses:
              componentInputParameter: p08_data_extraction_regenerate_responses
            dataset_name:
              componentInputParameter: p04_dataset_name
            hidden_states_path:
              componentInputParameter: p11_hidden_states_path
            output_dir:
              componentInputParameter: p10_output_dir
            packages_to_install:
              componentInputParameter: p38_packages_to_install
            persistent_mount_path:
              runtimeValue:
                constant: /mnt/persistent
            persistent_pvc:
              componentInputParameter: p01_persistent_pvc
            pvc_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
            speculator_type:
              componentInputParameter: p14_speculator_type
            target_layer_ids:
              componentInputParameter: p15_target_layer_ids
            total_seq_len:
              componentInputParameter: p13_total_seq_len
            training_envs:
              componentInputParameter: p36_job_envs
            training_runtime:
              componentInputParameter: p37_job_runtime
            verifier_model:
              componentInputParameter: p02_verifier_model_pvc
            verifier_model_pvc:
              componentInputParameter: p02_verifier_model_pvc
            vllm_endpoint:
              componentInputParameter: p03_vllm_endpoint
            vllm_source:
              runtimeValue:
                constant: remote
        taskInfo:
          name: extract-hidden-states
      kubeflow-model-registry:
        cachingOptions: {}
        componentRef:
          name: comp-kubeflow-model-registry
        dependentTasks:
        - evaluate-speculator
        - train-speculator-mode
        inputs:
          artifacts:
            eval_metrics:
              taskOutputArtifact:
                outputArtifactKey: output_metrics
                producerTask: evaluate-speculator
            eval_results:
              taskOutputArtifact:
                outputArtifactKey: output_results
                producerTask: evaluate-speculator
            input_metrics:
              taskOutputArtifact:
                outputArtifactKey: output_metrics
                producerTask: train-speculator-mode
            input_model:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-speculator-mode
          parameters:
            model_description:
              runtimeValue:
                constant: Speculator draft model trained by the offline pipeline.
            model_name:
              componentInputParameter: p49_model_registry_name
            model_pvc_name:
              componentInputParameter: p01_persistent_pvc
            model_version:
              componentInputParameter: p50_model_registry_version
            pvc_mount_path:
              runtimeValue:
                constant: /mnt/persistent
            registry_address:
              componentInputParameter: p47_model_registry_address
            registry_port:
              componentInputParameter: p48_model_registry_port
            shared_log_file:
              runtimeValue:
                constant: pipeline_log.txt
            source_namespace:
              runtimeValue:
                constant: ''
            source_pipeline_name:
              runtimeValue:
                constant: speculator-offline-pipeline
            source_pipeline_run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            source_pipeline_run_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
        taskInfo:
          name: kubeflow-model-registry
      speculative-decoding-serving:
        cachingOptions: {}
        componentRef:
          name: comp-speculative-decoding-serving
        dependentTasks:
        - kubeflow-model-registry
        inputs:
          parameters:
            draft_model_dir:
              runtimeValue:
                constant: final_model
            endpoint_name:
              componentInputParameter: p51_serving_endpoint_name
            gpu_memory_utilization:
              componentInputParameter: p44_evaluation_gpu_memory_utilization
            max_model_len:
              componentInputParameter: p13_total_seq_len
            model_cache_pvc:
              componentInputParameter: p01_persistent_pvc
            namespace:
              componentInputParameter: p06_serving_namespace
            num_speculative_tokens:
              componentInputParameter: p43_evaluation_num_speculative_tokens
            runtime_image:
              componentInputParameter: p52_serving_runtime_image
            verifier_model_dir:
              componentInputParameter: p02_verifier_model_pvc
        taskInfo:
          name: speculative-decoding-serving
      train-speculator-mode:
        cachingOptions: {}
        componentRef:
          name: comp-train-speculator-mode
        dependentTasks:
        - extract-hidden-states
        inputs:
          parameters:
            data_extraction_concurrency:
              componentInputParameter: p09_data_extraction_concurrency
            hidden_states_path:
              componentInputParameter: p11_hidden_states_path
            output_dir:
              componentInputParameter: p10_output_dir
            packages_to_install:
              componentInputParameter: p38_packages_to_install
            persistent_mount_path:
              runtimeValue:
                constant: /mnt/persistent
            persistent_pvc:
              componentInputParameter: p01_persistent_pvc
            pvc_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
            speculator_type:
              componentInputParameter: p14_speculator_type
            target_layer_ids:
              componentInputParameter: p15_target_layer_ids
            total_seq_len:
              componentInputParameter: p13_total_seq_len
            training_checkpoint_freq:
              runtimeValue:
                constant: 1.0
            training_data_path:
              componentInputParameter: p12_training_data_path
            training_draft_vocab_size:
              componentInputParameter: p18_training_draft_vocab_size
            training_embed_requires_grad:
              componentInputParameter: p23_training_embed_requires_grad
            training_envs:
              componentInputParameter: p36_job_envs
            training_epochs:
              componentInputParameter: p16_training_epochs
            training_hidden_states_dtype:
              componentInputParameter: p24_training_hidden_states_dtype
            training_log_freq:
              runtimeValue:
                constant: 1.0
            training_lr:
              componentInputParameter: p17_training_lr
            training_norm_before_fc:
              componentInputParameter: p22_training_norm_before_fc
            training_norm_before_residual:
              componentInputParameter: p21_training_norm_before_residual
            training_num_layers:
              componentInputParameter: p19_training_num_layers
            training_resource_cpu:
              componentInputParameter: p33_training_resource_cpu
            training_resource_gpu:
              componentInputParameter: p34_training_resource_gpu
            training_resource_memory:
              componentInputParameter: p35_training_resource_memory
            training_resume_from_checkpoint:
              componentInputParameter: p32_training_resume_from_checkpoint
            training_runtime:
              componentInputParameter: p37_job_runtime
            training_save_best:
              componentInputParameter: p30_training_save_best
            training_scheduler_num_cosine_cycles:
              runtimeValue:
                constant: 0.5
            training_scheduler_total_steps:
              componentInputParameter: p27_training_scheduler_total_steps
            training_scheduler_type:
              componentInputParameter: p25_training_scheduler_type
            training_scheduler_warmup_steps:
              componentInputParameter: p26_training_scheduler_warmup_steps
            training_ttt_steps:
              componentInputParameter: p20_training_test_time_steps
            verifier_model:
              componentInputParameter: p02_verifier_model_pvc
            verifier_model_pvc:
              componentInputParameter: p02_verifier_model_pvc
        taskInfo:
          name: train-speculator-mode
  inputDefinitions:
    parameters:
      p01_persistent_pvc:
        description: 'Required name of the existing ReadWriteMany PVC in the pipeline
          namespace. It stores

          the verifier, datasets, extraction outputs, checkpoints, and final draft;
          KServe must also access it in

          ``p06_serving_namespace``. The PVC is mounted at ``/mnt/persistent``.'
        parameterType: STRING
      p02_verifier_model_pvc:
        description: 'Required verifier model directory on the PVC, as a relative
          path or matching

          ``pvc://`` URI. The model must already exist there; the pipeline does not
          download verifier models.'
        parameterType: STRING
      p03_vllm_endpoint:
        description: 'Required URL for the external vLLM service. Set it to an endpoint
          that can access the

          verifier and hidden-state paths on ``p01_persistent_pvc``.'
        parameterType: STRING
      p04_dataset_name:
        description: 'Required built-in dataset name or PVC URI to JSON/JSONL file.
          Supported built-ins

          are ``magpie``, ``ultrachat``, and ``gsm8k``; PVC URIs must use ``pvc://<pvc-name>/<path>``
          format.'
        parameterType: STRING
      p05_evaluation_dataset_uri:
        description: 'Required Hugging Face dataset ID or local JSON/JSONL file. A
          ``pvc://`` URI must

          reference ``p01_persistent_pvc``.'
        parameterType: STRING
      p06_serving_namespace:
        description: 'Required KServe namespace; must access the PVC. The pipeline
          ServiceAccount needs

          permission to manage the ServingRuntime and InferenceService.'
        parameterType: STRING
      p07_data_extraction_max_samples:
        defaultValue: 0.0
        description: Maximum extraction examples. Set to ``0`` to process the full
          dataset.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p08_data_extraction_regenerate_responses:
        defaultValue: false
        description: 'Regenerate assistant responses with the verifier instead of
          using

          original responses. Supported only for the built-in datasets.'
        isOptional: true
        parameterType: BOOLEAN
      p09_data_extraction_concurrency:
        defaultValue: 1.0
        description: 'Extraction request concurrency and training ``datagen_concurrency``;

          affects training data-loading throughput. Use ``1`` on shared or NFS PVCs.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      p10_output_dir:
        defaultValue: speculator-output
        description: 'PVC-relative directory for extraction output, processed training
          data, and checkpoints. The

          final draft is copied to ``final_model`` at the PVC root.'
        isOptional: true
        parameterType: STRING
      p11_hidden_states_path:
        defaultValue: speculator-output/hidden_states
        description: 'PVC-relative hidden-state directory written by extraction and
          read by training. Keep

          this path aligned with the output directory.'
        isOptional: true
        parameterType: STRING
      p12_training_data_path:
        defaultValue: speculator-output
        description: 'Directory containing the processed dataset written by extraction.
          Keep it aligned

          with ``p10_output_dir`` when changing the defaults.'
        isOptional: true
        parameterType: STRING
      p13_total_seq_len:
        defaultValue: 2048.0
        description: Positive maximum sequence length used for extraction, training,
          and serving.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p14_speculator_type:
        defaultValue: eagle3
        description: Draft architecture. The current Trainer and evaluator support
          ``eagle3``.
        isOptional: true
        parameterType: STRING
      p15_target_layer_ids:
        defaultValue: ''
        description: 'Required in offline mode. Supply four comma-separated layer
          IDs matching the verifier.

          The SDK cannot auto-detect layer IDs from the PVC-backed verifier; the input
          defaults to empty but must be

          populated.'
        isOptional: true
        parameterType: STRING
      p16_training_epochs:
        defaultValue: 3.0
        description: Number of training epochs.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p17_training_lr:
        defaultValue: 0.0001
        description: Learning rate for draft-model training.
        isOptional: true
        parameterType: NUMBER_DOUBLE
      p18_training_draft_vocab_size:
        defaultValue: 0.0
        description: Draft vocabulary size. ``0`` lets the Trainer SDK derive it.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p19_training_num_layers:
        defaultValue: 1.0
        description: Number of layers in the draft model.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p20_training_test_time_steps:
        defaultValue: 1.0
        description: Number of test-time training steps configured for Speculator.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p21_training_norm_before_residual:
        defaultValue: true
        description: Apply normalization before the residual connection.
        isOptional: true
        parameterType: BOOLEAN
      p22_training_norm_before_fc:
        defaultValue: false
        description: Apply normalization before the fully connected layer.
        isOptional: true
        parameterType: BOOLEAN
      p23_training_embed_requires_grad:
        defaultValue: false
        description: Whether draft embedding weights are trainable.
        isOptional: true
        parameterType: BOOLEAN
      p24_training_hidden_states_dtype:
        defaultValue: bfloat16
        description: Hidden-state dtype; it must match the verifier model.
        isOptional: true
        parameterType: STRING
      p25_training_scheduler_type:
        defaultValue: linear
        description: 'Learning-rate scheduler: ``linear``, ``cosine``, or ``none``.'
        isOptional: true
        parameterType: STRING
      p26_training_scheduler_warmup_steps:
        defaultValue: 0.0
        description: Warmup steps. ``0`` lets the SDK calculate them.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p27_training_scheduler_total_steps:
        defaultValue: 0.0
        description: Total scheduler steps. ``0`` lets the SDK calculate them.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p30_training_save_best:
        defaultValue: false
        description: Save the best checkpoint by validation loss.
        isOptional: true
        parameterType: BOOLEAN
      p32_training_resume_from_checkpoint:
        defaultValue: false
        description: Resume from a saved checkpoint when supported by the runtime.
        isOptional: true
        parameterType: BOOLEAN
      p33_training_resource_cpu:
        defaultValue: '4'
        description: CPU request for the training worker.
        isOptional: true
        parameterType: STRING
      p34_training_resource_gpu:
        defaultValue: 1.0
        description: Number of GPUs requested for the training worker.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p35_training_resource_memory:
        defaultValue: 64Gi
        description: Memory request for the training worker.
        isOptional: true
        parameterType: STRING
      p36_job_envs:
        defaultValue: NCCL_DEBUG=INFO,PYTHONUNBUFFERED=1
        description: 'Comma-separated ``KEY=VALUE`` environment overrides shared by
          extraction and training jobs.

          Set ``PIP_INDEX_URL`` or ``PIP_EXTRA_INDEX_URL`` here to select a custom
          index for

          ``p38_packages_to_install``.'
        isOptional: true
        parameterType: STRING
      p37_job_runtime:
        defaultValue: speculator-model-opt-cuda
        description: ClusterTrainingRuntime shared by hidden-state extraction and
          draft training.
        isOptional: true
        parameterType: STRING
      p38_packages_to_install:
        defaultValue: ''
        description: Comma-separated Python packages installed in extraction and training
          jobs.
        isOptional: true
        parameterType: STRING
      p40_evaluation_max_samples:
        defaultValue: 80.0
        description: Maximum GuideLLM requests per evaluation sweep point; must be
          positive.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p41_evaluation_max_tokens:
        defaultValue: 256.0
        description: Maximum tokens generated per evaluation request; must be positive.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p42_evaluation_temperature:
        defaultValue: 0.0
        description: Sampling temperature passed to GuideLLM. ``0`` is deterministic.
        isOptional: true
        parameterType: NUMBER_DOUBLE
      p43_evaluation_num_speculative_tokens:
        defaultValue: 5.0
        description: Draft tokens proposed per step in evaluation and serving.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p44_evaluation_gpu_memory_utilization:
        defaultValue: 0.9
        description: 'GPU memory fraction for evaluation and serving, greater than
          ``0`` and

          at most ``1.0``.'
        isOptional: true
        parameterType: NUMBER_DOUBLE
      p45_evaluation_startup_timeout_seconds:
        defaultValue: 900.0
        description: Maximum wait for the evaluation vLLM server to become ready.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p47_model_registry_address:
        defaultValue: ''
        description: 'Model Registry hostname. Enter only the host, not the scheme
          or API path. Its

          default is empty, which skips registration.'
        isOptional: true
        parameterType: STRING
      p48_model_registry_port:
        defaultValue: 8080.0
        description: HTTP REST service port copied from the Model Registry URL; ``8080``
          is common.
        isOptional: true
        parameterType: NUMBER_INTEGER
      p49_model_registry_name:
        defaultValue: speculator-offline-draft
        description: Name assigned to the registered draft model; use a unique name
          in the registry.
        isOptional: true
        parameterType: STRING
      p50_model_registry_version:
        defaultValue: 1.0.0
        description: Version label for this registration. Use a new value for each
          revision.
