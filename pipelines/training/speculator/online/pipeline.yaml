# PIPELINE DEFINITION
# Name: speculator-online-pipeline
# Description: Train a Speculator model with managed vLLM in online mode.
# Inputs:
#    data_extraction_concurrency: int [Default: 4.0]
#    data_extraction_max_samples: int [Default: 16.0]
#    data_extraction_regenerate_responses: bool [Default: False]
#    dataset_name: str [Default: 'ultrachat']
#    enable_progression_tracking: bool [Default: True]
#    evaluation_dataset_uri: str
#    evaluation_gpu_memory_utilization: float [Default: 0.9]
#    evaluation_max_samples: int [Default: 20.0]
#    evaluation_max_tokens: int [Default: 256.0]
#    evaluation_num_speculative_tokens: int [Default: 5.0]
#    evaluation_request_timeout_seconds: int [Default: 600.0]
#    evaluation_sample_seed: int [Default: 42.0]
#    evaluation_startup_timeout_seconds: int [Default: 900.0]
#    evaluation_temperature: float [Default: 0.0]
#    metrics_poll_interval_seconds: int [Default: 30.0]
#    metrics_port: int [Default: 28080.0]
#    output_dir: str [Default: 'speculator-output']
#    packages_to_install: str [Default: '']
#    persistent_pvc: str
#    pip_index_urls: str [Default: '']
#    speculator_type: str [Default: 'eagle3']
#    target_layer_ids: str [Default: '']
#    total_seq_len: int [Default: 2048.0]
#    training_checkpoint_freq: float [Default: 1.0]
#    training_draft_vocab_size: int [Default: 0.0]
#    training_embed_requires_grad: bool [Default: False]
#    training_envs: str [Default: 'NCCL_DEBUG=INFO,PYTHONUNBUFFERED=1']
#    training_epochs: int [Default: 1.0]
#    training_from_pretrained: str [Default: '']
#    training_hidden_states_dtype: str [Default: 'bfloat16']
#    training_log_freq: int [Default: 1.0]
#    training_lr: float [Default: 0.0001]
#    training_norm_before_fc: bool [Default: False]
#    training_norm_before_residual: bool [Default: True]
#    training_num_layers: int [Default: 1.0]
#    training_resource_cpu: str [Default: '4']
#    training_resource_gpu: int [Default: 1.0]
#    training_resource_memory: str [Default: '64Gi']
#    training_resume_from_checkpoint: bool [Default: False]
#    training_runtime: str [Default: 'vllm-extract-cuda']
#    training_save_best: bool [Default: False]
#    training_scheduler_num_cosine_cycles: float [Default: 0.5]
#    training_scheduler_total_steps: int [Default: 0.0]
#    training_scheduler_type: str [Default: 'linear']
#    training_scheduler_warmup_steps: int [Default: 0.0]
#    training_ttt_steps: int [Default: 1.0]
#    verifier_model: str [Default: 'Qwen/Qwen2.5-1.5B-Instruct']
#    verifier_model_pvc: str [Default: 'models/Qwen--Qwen2.5-1.5B-Instruct']
#    vllm_gpu_memory_utilization: float [Default: 0.9]
#    vllm_readiness_timeout_minutes: int [Default: 60.0]
#    vllm_resource_gpu: int [Default: 1.0]
#    vllm_resource_memory: str [Default: '96Gi']
components:
  comp-download-model:
    executorLabel: exec-download-model
    inputDefinitions:
      parameters:
        download_enabled:
          defaultValue: true
          description: If False, return the expected model directory without downloading.
          isOptional: true
          parameterType: BOOLEAN
        model_cache_mount:
          defaultValue: /mnt/models
          description: Mount path for the model cache PVC.
          isOptional: true
          parameterType: STRING
        model_cache_pvc:
          description: Name of the PVC to store models (unused here, mounted via pipeline).
          parameterType: STRING
        model_name:
          description: HuggingFace model ID (e.g. 'mistralai/Mistral-7B-Instruct-v0.3').
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-evaluate-speculator:
    executorLabel: exec-evaluate-speculator
    inputDefinitions:
      parameters:
        draft_model_path:
          description: Local path to the trained draft model on the mounted PVC.
          parameterType: STRING
        evaluation_dataset_mount_path:
          defaultValue: /mnt/persistent
          description: Local mount prefix for a relative dataset path.
          isOptional: true
          parameterType: STRING
        evaluation_dataset_uri:
          description: Local or PVC-relative path to the evaluation JSONL.
          parameterType: STRING
        evaluation_gpu_memory_utilization:
          defaultValue: 0.9
          description: vLLM GPU memory utilization fraction.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        evaluation_max_samples:
          defaultValue: 80.0
          description: Maximum number of prompts to evaluate.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_max_tokens:
          defaultValue: 256.0
          description: Maximum completion tokens per prompt.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_model_mount_path:
          defaultValue: /mnt/persistent
          description: Local mount prefix for a relative verifier path.
          isOptional: true
          parameterType: STRING
        evaluation_num_speculative_tokens:
          defaultValue: 5.0
          description: Number of draft tokens proposed per step.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_port:
          defaultValue: 8000.0
          description: Local port used by the temporary vLLM servers.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_request_timeout_seconds:
          defaultValue: 600.0
          description: Maximum time allowed for one request.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_sample_seed:
          defaultValue: 42.0
          description: Seed used for deterministic dataset sampling.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_speculator_type:
          description: Speculator method used by the draft checkpoint.
          parameterType: STRING
        evaluation_startup_timeout_seconds:
          defaultValue: 900.0
          description: Maximum time to wait for vLLM startup.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evaluation_temperature:
          defaultValue: 0.0
          description: Sampling temperature sent to both servers.
          isOptional: true
          parameterType: NUMBER_DOUBLE
        verifier_model:
          description: Local or PVC-relative path to the verifier model.
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-online-speculator:
    executorLabel: exec-online-speculator
    inputDefinitions:
      parameters:
        data_extraction_concurrency:
          defaultValue: 4.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_extraction_max_samples:
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_extraction_regenerate_responses:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        dataset_name:
          parameterType: STRING
        enable_progression_tracking:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        kubernetes_config:
          isOptional: true
          parameterType: TASK_CONFIG
        metrics_poll_interval_seconds:
          defaultValue: 30.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        metrics_port:
          defaultValue: 28080.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        output_dir:
          parameterType: STRING
        packages_to_install:
          isOptional: true
          parameterType: STRING
        persistent_mount_path:
          defaultValue: /mnt/persistent
          isOptional: true
          parameterType: STRING
        persistent_pvc:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        pip_index_urls:
          isOptional: true
          parameterType: STRING
        pvc_path:
          parameterType: STRING
        speculator_type:
          defaultValue: eagle3
          isOptional: true
          parameterType: STRING
        target_layer_ids:
          isOptional: true
          parameterType: STRING
        total_seq_len:
          defaultValue: 2048.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_checkpoint_freq:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_draft_vocab_size:
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_embed_requires_grad:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_envs:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        training_epochs:
          defaultValue: 3.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_from_pretrained:
          isOptional: true
          parameterType: STRING
        training_hidden_states_dtype:
          defaultValue: bfloat16
          isOptional: true
          parameterType: STRING
        training_log_freq:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_lr:
          defaultValue: 0.0001
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_norm_before_fc:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_norm_before_residual:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        training_num_layers:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_resource_cpu:
          defaultValue: '4'
          isOptional: true
          parameterType: STRING
        training_resource_gpu:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_resource_memory:
          defaultValue: 64Gi
          isOptional: true
          parameterType: STRING
        training_resume_from_checkpoint:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_runtime:
          defaultValue: vllm-extract-cuda
          isOptional: true
          parameterType: STRING
        training_save_best:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        training_scheduler_num_cosine_cycles:
          defaultValue: 0.5
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_scheduler_total_steps:
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_scheduler_type:
          defaultValue: linear
          isOptional: true
          parameterType: STRING
        training_scheduler_warmup_steps:
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_ttt_steps:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        verifier_model:
          parameterType: STRING
        verifier_model_pvc:
          isOptional: true
          parameterType: STRING
        vllm_gpu_memory_utilization:
          defaultValue: 0.9
          isOptional: true
          parameterType: NUMBER_DOUBLE
        vllm_readiness_timeout_minutes:
          defaultValue: 60.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        vllm_resource_gpu:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        vllm_resource_memory:
          defaultValue: 96Gi
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
    taskConfigPassthroughs:
    - field: RESOURCES
    - field: KUBERNETES_TOLERATIONS
    - field: KUBERNETES_NODE_SELECTOR
    - field: KUBERNETES_AFFINITY
    - applyToTask: true
      field: ENV
    - applyToTask: true
      field: KUBERNETES_VOLUMES
deploymentSpec:
  executors:
    exec-download-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - download_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'huggingface_hub>=0.20.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_model(\n    model_name: str,\n    model_cache_pvc: str,\n\
          \    model_cache_mount: str = \"/mnt/models\",\n    download_enabled: bool\
          \ = True,\n) -> str:\n    \"\"\"Download a HuggingFace model to a PVC for\
          \ caching.\n\n    If the model is already present on the PVC, skips the\
          \ download.\n\n    Args:\n        model_name: HuggingFace model ID (e.g.\
          \ 'mistralai/Mistral-7B-Instruct-v0.3').\n        model_cache_pvc: Name\
          \ of the PVC to store models (unused here, mounted via pipeline).\n    \
          \    model_cache_mount: Mount path for the model cache PVC.\n        download_enabled:\
          \ If False, return the expected model directory without downloading.\n\n\
          \    Returns:\n        The PVC sub-path where the model is stored.\n   \
          \ \"\"\"\n    import os\n\n    from huggingface_hub import snapshot_download\n\
          \n    model_dir_name = model_name.replace(\"/\", \"--\")\n    model_path\
          \ = os.path.join(model_cache_mount, model_dir_name)\n    if not download_enabled:\n\
          \        print(f\"Model download disabled; expected model path is {model_path}.\"\
          )\n        return model_dir_name\n    sentinel = os.path.join(model_path,\
          \ \".download_complete\")\n\n    if os.path.exists(sentinel):\n        file_count\
          \ = sum(1 for _ in os.scandir(model_path) if _.is_file())\n        print(f\"\
          Model '{model_name}' already cached at {model_path} ({file_count} files).\
          \ Skipping download.\")\n        return model_dir_name\n\n    print(f\"\
          Downloading model '{model_name}' to {model_path}...\")\n    snapshot_download(\n\
          \        repo_id=model_name,\n        local_dir=model_path,\n        local_dir_use_symlinks=False,\n\
          \    )\n\n    with open(sentinel, \"w\") as f:\n        f.write(model_name)\n\
          \n    file_count = sum(1 for _ in os.scandir(model_path) if _.is_file())\n\
          \    print(f\"Model '{model_name}' downloaded to {model_path} ({file_count}\
          \ files).\")\n    return model_dir_name\n\n"
        image: registry.redhat.io/rhoai/odh-pipeline-runtime-datascience-cpu-py312-rhel9@sha256:f9844dc150592a9f196283b3645dda92bd80dfdb3d467fa8725b10267ea5bdbc
    exec-evaluate-speculator:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_speculator
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ 'requests>=2.32.0' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_speculator(\n    output_metrics: dsl.Output[dsl.Metrics],\n\
          \    output_results: dsl.Output[dsl.Artifact],\n    verifier_model: str,\n\
          \    draft_model_path: str,\n    evaluation_dataset_uri: str,\n    evaluation_speculator_type:\
          \ str,\n    evaluation_max_samples: int = 80,\n    evaluation_max_tokens:\
          \ int = 256,\n    evaluation_temperature: float = 0.0,\n    evaluation_num_speculative_tokens:\
          \ int = 5,\n    evaluation_gpu_memory_utilization: float = 0.9,\n    evaluation_port:\
          \ int = 8000,\n    evaluation_startup_timeout_seconds: int = 900,\n    evaluation_request_timeout_seconds:\
          \ int = 600,\n    evaluation_sample_seed: int = 42,\n    evaluation_model_mount_path:\
          \ str = \"/mnt/persistent\",\n    evaluation_dataset_mount_path: str = \"\
          /mnt/persistent\",\n) -> None:\n    \"\"\"Evaluate a draft model with verifier-only\
          \ and speculative vLLM servers.\n\n    The component starts a verifier-only\
          \ server to establish a latency baseline,\n    then restarts vLLM with the\
          \ draft model configured for speculative decoding.\n    The evaluation dataset\
          \ must be a JSONL file referenced by\n    ``evaluation_dataset_uri`` with\
          \ a ``prompt``, ``messages``, or\n    ``conversations`` field, or a string\
          \ value on each line. At most\n    ``evaluation_max_samples`` records are\
          \ selected deterministically. The output Metrics artifact contains\n   \
          \ ``acceptance_rate``, ``acceptance_length``, and ``speedup`` for Model\n\
          \    Registry integration.\n\n    Args:\n        output_metrics: KFP Metrics\
          \ artifact for acceptance and speedup values.\n        output_results: JSON\
          \ artifact containing raw timing and acceptance results.\n        verifier_model:\
          \ Local or PVC-relative path to the verifier model.\n        draft_model_path:\
          \ Local path to the trained draft model on the mounted PVC.\n        evaluation_dataset_uri:\
          \ Local or PVC-relative path to the evaluation JSONL.\n        evaluation_max_samples:\
          \ Maximum number of prompts to evaluate.\n        evaluation_max_tokens:\
          \ Maximum completion tokens per prompt.\n        evaluation_temperature:\
          \ Sampling temperature sent to both servers.\n        evaluation_num_speculative_tokens:\
          \ Number of draft tokens proposed per step.\n        evaluation_speculator_type:\
          \ Speculator method used by the draft checkpoint.\n        evaluation_gpu_memory_utilization:\
          \ vLLM GPU memory utilization fraction.\n        evaluation_port: Local\
          \ port used by the temporary vLLM servers.\n        evaluation_startup_timeout_seconds:\
          \ Maximum time to wait for vLLM startup.\n        evaluation_request_timeout_seconds:\
          \ Maximum time allowed for one request.\n        evaluation_sample_seed:\
          \ Seed used for deterministic dataset sampling.\n        evaluation_model_mount_path:\
          \ Local mount prefix for a relative verifier path.\n        evaluation_dataset_mount_path:\
          \ Local mount prefix for a relative dataset path.\n    \"\"\"\n    import\
          \ json\n    import os\n    import random\n    import signal\n    import\
          \ subprocess\n    import time\n    from pathlib import Path\n\n    import\
          \ requests\n\n    os.environ[\"VLLM_WORKER_MULTIPROC_METHOD\"] = \"spawn\"\
          \n    verifier_path = verifier_model\n    if verifier_path.startswith(\"\
          pvc://\"):\n        verifier_path = verifier_path.removeprefix(\"pvc://\"\
          ).split(\"/\", 1)[-1]\n    if not os.path.isabs(verifier_path):\n      \
          \  verifier_path = os.path.join(evaluation_model_mount_path, verifier_path)\n\
          \    draft_path = draft_model_path\n    if not os.path.isabs(draft_path):\n\
          \        draft_path = os.path.join(evaluation_model_mount_path, draft_path)\n\
          \    dataset_path = evaluation_dataset_uri\n    if dataset_path.startswith(\"\
          pvc://\"):\n        dataset_path = dataset_path.removeprefix(\"pvc://\"\
          )\n    if not os.path.isabs(dataset_path):\n        dataset_path = os.path.join(evaluation_dataset_mount_path,\
          \ dataset_path)\n    dataset_path = Path(dataset_path)\n    if dataset_path.is_dir():\n\
          \        candidates = sorted(dataset_path.glob(\"*.jsonl\"))\n        if\
          \ not candidates:\n            raise ValueError(f\"No JSONL dataset found\
          \ in {dataset_path}\")\n        dataset_path = candidates[0]\n\n    prompts\
          \ = []\n    with dataset_path.open() as dataset_file:\n        for line\
          \ in dataset_file:\n            if not line.strip():\n                continue\n\
          \            record = json.loads(line)\n            if isinstance(record,\
          \ str):\n                prompt = record\n            else:\n          \
          \      prompt = record.get(\"prompt\")\n                if not prompt:\n\
          \                    messages = record.get(\"messages\") or record.get(\"\
          conversations\") or []\n                    user_messages = [\n        \
          \                message for message in messages if message.get(\"role\"\
          , message.get(\"from\")) in (\"user\", \"human\")\n                    ]\n\
          \                    if user_messages:\n                        prompt =\
          \ user_messages[-1].get(\"content\", user_messages[-1].get(\"value\"))\n\
          \            if not prompt:\n                raise ValueError(\"Each evaluation\
          \ record must contain a prompt or user message\")\n            prompts.append(prompt)\n\
          \    if not prompts:\n        raise ValueError(\"The evaluation dataset\
          \ contains no prompts\")\n    if evaluation_max_samples <= 0:\n        raise\
          \ ValueError(\"evaluation_max_samples must be greater than zero\")\n   \
          \ if len(prompts) > evaluation_max_samples:\n        prompts = random.Random(evaluation_sample_seed).sample(prompts,\
          \ evaluation_max_samples)\n\n    endpoint = f\"http://127.0.0.1:{evaluation_port}\"\
          \n    process = None\n\n    def stop_server() -> None:\n        nonlocal\
          \ process\n        if process is None:\n            return\n        if process.poll()\
          \ is None:\n            os.killpg(process.pid, signal.SIGTERM)\n       \
          \     try:\n                process.wait(timeout=30)\n            except\
          \ subprocess.TimeoutExpired:\n                process.kill()\n         \
          \       process.wait()\n        process = None\n\n    def start_server(speculative:\
          \ bool) -> None:\n        nonlocal process\n        command = [\n      \
          \      \"vllm\",\n            \"serve\",\n            verifier_path,\n \
          \           \"--host\",\n            \"127.0.0.1\",\n            \"--port\"\
          ,\n            str(evaluation_port),\n            \"--gpu-memory-utilization\"\
          ,\n            str(evaluation_gpu_memory_utilization),\n        ]\n    \
          \    if speculative:\n            methods = {\"eagle3\": \"eagle3\", \"\
          dflash\": \"dflash\", \"mtp\": \"mtp\", \"peagle\": \"eagle3\"}\n      \
          \      method = methods.get(evaluation_speculator_type.lower())\n      \
          \      if method is None:\n                raise ValueError(f\"Unsupported\
          \ evaluation_speculator_type: {evaluation_speculator_type}\")\n        \
          \    command.extend(\n                [\n                    \"--speculative-config\"\
          ,\n                    json.dumps(\n                        {\n        \
          \                    \"method\": method,\n                            \"\
          model\": draft_path,\n                            \"num_speculative_tokens\"\
          : evaluation_num_speculative_tokens,\n                        }\n      \
          \              ),\n                ]\n            )\n        process = subprocess.Popen(command,\
          \ start_new_session=True)\n        deadline = time.monotonic() + evaluation_startup_timeout_seconds\n\
          \        while time.monotonic() < deadline:\n            if process.poll()\
          \ is not None:\n                raise RuntimeError(f\"vLLM exited during\
          \ startup with code {process.returncode}\")\n            try:\n        \
          \        response = requests.get(f\"{endpoint}/health\", timeout=5)\n  \
          \              if response.ok:\n                    return\n           \
          \ except requests.RequestException:\n                pass\n            time.sleep(2)\n\
          \        raise TimeoutError(f\"vLLM did not become ready within {evaluation_startup_timeout_seconds}\
          \ seconds\")\n\n    def run_requests() -> tuple[float, int]:\n        started\
          \ = time.perf_counter()\n        output_tokens = 0\n        for prompt in\
          \ prompts:\n            response = requests.post(\n                f\"{endpoint}/v1/completions\"\
          ,\n                json={\n                    \"model\": verifier_path,\n\
          \                    \"prompt\": prompt,\n                    \"max_tokens\"\
          : evaluation_max_tokens,\n                    \"temperature\": evaluation_temperature,\n\
          \                },\n                timeout=evaluation_request_timeout_seconds,\n\
          \            )\n            response.raise_for_status()\n            usage\
          \ = response.json().get(\"usage\", {})\n            output_tokens += int(usage.get(\"\
          completion_tokens\", 0))\n        return time.perf_counter() - started,\
